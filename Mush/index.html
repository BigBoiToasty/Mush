<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React App</title>
    <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
    <div id="root"></div>
    
    <div id="authContainer">
        <h2 id="authTitle">Login</h2>
        <input type="email" id="authEmail" placeholder="Email">
        <input type="password" id="authPassword" placeholder="Password">
        <button id="loginButton">Login</button>
        <button id="signupButton">Sign Up</button>
        <p id="authError" hidden="hidden"></p>
    </div>
 
    <div id="appContainer" hidden="hidden">
 
        <button id="logoutButton">Logout</button>

        <div id="binderControls">
            <select id="binderSelect"></select>
            <input type="text" id="newBinderName" placeholder="New binder name">
            <button id="createBinderButton">Create Binder</button>
        </div>
 

        <div id = "search" hidden = "hidden"> 
        <input type = "text" id = "pokemonName" placeholder = "Pokemon Name"> 
        <button id = "searchButton" >Find</button><br>
        Cards Options <br>
        </div>
        <div id = "pokeGallery" hidden = "hidden">
        <br>
        </div>


        HELLO
        <div id = "testGallery" class = "testGallery"> </div>
        
        <div id="pageControls" hidden="hidden">
            <button id="prevPage">Previous</button>
            <span id="pageLabel">Page 1</span>
            <button id="nextPage">Next</button>
        </div>

    </div>

    <script type = "module" src="/src/index.js"></script>
</body>
</html>
